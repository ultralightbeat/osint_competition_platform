name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: osint
          POSTGRES_PASSWORD: osint
          POSTGRES_DB: osint_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint -d osint_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      FLASK_APP: src/app.py
      FLASK_ENV: production
      PYTHONPATH: .
      DATABASE_URL: postgresql://osint:osint@localhost:5432/osint_ci
      JWT_SECRET_KEY: ci-jwt-secret
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Validate migrations
        run: |
          flask db upgrade
          python - <<'PY'
          import os
          import psycopg2

          dsn = os.environ["DATABASE_URL"]
          with psycopg2.connect(dsn) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT is_nullable, column_default
                      FROM information_schema.columns
                      WHERE table_name = 'users' AND column_name = 'is_creator'
                      """
                  )
                  row = cur.fetchone()
                  if row is None:
                      raise SystemExit("users.is_creator column is missing after migrations")
                  is_nullable, column_default = row
                  if is_nullable != "NO":
                      raise SystemExit("users.is_creator must be NOT NULL")
                  if column_default is None:
                      raise SystemExit("users.is_creator must have server default")
          print("Migration schema check passed")
          PY
        working-directory: backend

      - name: Static syntax check
        run: python -m compileall src
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
