services:
  nginx:
    image: nginx:alpine
    container_name: osint_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    depends_on:
      - backend
      - frontend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osint_frontend
    environment:
      - VITE_API_URL=${API_URL}
      - VITE_WS_URL=${WS_URL}
    command: ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5173"]
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osint_backend
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: always

  celery_validation:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osint_celery_validation
    command: celery -A src.celery_app.celery worker --loglevel=info -Q validation --concurrency=4
    env_file:
      - .env
    depends_on:
      - backend
      - rabbitmq
      - redis
    restart: always

  celery_rating:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osint_celery_rating
    command: celery -A src.celery_app.celery worker --loglevel=info -Q rating --concurrency=2
    env_file:
      - .env
    depends_on:
      - backend
      - rabbitmq
      - redis
    restart: always

  celery_metrics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osint_celery_metrics
    command: celery -A src.celery_app.celery worker --loglevel=info -Q metrics --concurrency=2
    env_file:
      - .env
    depends_on:
      - backend
      - rabbitmq
      - redis
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osint_celery_beat
    command: celery -A src.celery_app.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - backend
      - rabbitmq
    restart: always

  db:
    image: postgres:15-alpine
    container_name: osint_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: osint_redis
    volumes:
      - redis_data:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: osint_rabbitmq
    ports:
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
